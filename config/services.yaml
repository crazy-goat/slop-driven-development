parameters:
    default_lang: 'pl'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    App\Controller\BlogController:
        tags: ['controller.service_arguments']

    App\Controller\SitemapController:
        tags: ['controller.service_arguments']

    App\Controller\AssetController:
        tags: ['controller.service_arguments']

    App\Service\ArticleRepository:
        arguments:
            $contentDir: '%kernel.project_dir%/content'

    App\Service\MarkdownParser:

    App\Twig\InlineAssetExtension:
        arguments:
            $publicDir: '%kernel.project_dir%/public'

    App\Command\ContentValidateCommand:
        arguments:
            $contentDir: '%kernel.project_dir%/content'
